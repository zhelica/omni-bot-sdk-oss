# RPA API 服务配置（可选）
# 提供 HTTP REST API 接口，允许外部系统直接调用 RPA 任务
rpa_api:
  enabled: true
  host: 0.0.0.0
  port: 8001
  #接口回调地址
  callback_url:
#  callback_url: "http://127.0.0.1:8080/openApi/getUpdates/message"
  #延迟消费秒数
  process_delay: 0
  #自动消费
  auto_consume: true
  #api消费
  api_consume: true

# WebSocket 服务配置
websocket:
  # WebSocket 服务配置，用于与外部 AI 服务通信
  enabled: false
  host: "0.0.0.0"
  port: 8002
  secret_key: ""
  # 认证信息
  app_key: "your-app-key"
  app_secret: "your-app-secret"
  guid: "your-guid"

# MCP服务配置
mcp:
  # 监听主机地址，通常为0.0.0.0表示所有网卡
  host: 0.0.0.0
  # 监听端口
  port: 8000

logging:
  # 日志文件最多保留数量
  backup_count: 5
  # 日志级别，可选：DEBUG/INFO/WARNING/ERROR
  level: INFO
  # 单个日志文件最大字节数
  max_size: 10485760
  # 日志文件存放路径
  path: logs

